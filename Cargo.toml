[package]
name = "dioxus-bootstrap"
version = "0.2.0"
authors = ["Erica Stith <rexlunae@gmail.com>"]
edition = "2024"
description = "A set of Bootstrap-based components for Dioxus."
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/dioxus_bootstrap/"
keywords = ["dioxus", "bootstrap", "components", "web"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.6.3", features = ["fullstack"] }
dioxus-router = "0.6.3"

[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

[profile]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"

[workspace]
members = [
    "demo"
]
