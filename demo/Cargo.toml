[package]
name = "demo"
version = "0.1.1"
authors = ["Erica Stith <rexlunae@gmail.com>"]
edition = "2021"
description = "Demo application for dioxus-bootstrap, a set of Bootstrap-based components for Dioxus."
license = "MIT OR Apache-2.0"
documentation = "../README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.6.0", features = ["fullstack", "router"] }
dioxus-bootstrap = { version = "0.1.5", path = "../" }

[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
