[package]
name = "demo"
version = "0.7.0"
authors = ["Erica Stith <rexlunae@gmail.com>"]
edition = "2024"
description = "Demo application for dioxus-bootstrap, a set of Bootstrap-based components for Dioxus."
license = "MIT OR Apache-2.0"
documentation = "../README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7", features = ["fullstack", "router"] }
dioxus-bootstrap = { path = "../" }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement"] }
wasm-bindgen = "0.2"

[features]
default = []
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
